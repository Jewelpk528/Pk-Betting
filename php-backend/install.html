<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Install Livo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:#0a0a0a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    img.logo { width:240px; max-width:60vw; margin-bottom:30px; filter: drop-shadow(0 4px 16px rgba(255,140,0,0.3)); }
    h1 { font-size:28px; margin-bottom:8px; letter-spacing:1px; }
    p.sub { color:#aaa; margin-bottom:36px; font-size:15px; text-align:center; }
    a.btn { display:inline-flex; align-items:center; gap:10px; padding:16px 36px; font-size:18px; font-weight:600; color:#fff; text-decoration:none; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.4); transition:transform .15s ease, box-shadow .15s ease; min-width:260px; justify-content:center; margin:8px 0; }
    a.btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.5); }
    a.btn.android { background:linear-gradient(135deg,#3DDC84,#0F9D58); }
    a.btn.ios { background:linear-gradient(135deg,#1E88E5,#0D47A1); }
    a.btn.web { background:linear-gradient(135deg,#FB8C00,#E65100); }
    .note { color:#666; font-size:12px; margin-top:24px; text-align:center; max-width:400px; line-height:1.5; }
    .platform-hidden { display:none; }
  </style>
</head>
<body>
  <img class="logo" src="https://games.livo.ink/logo.png" alt="Livo">
  <h1>Install Livo</h1>
  <p class="sub">Choose your platform</p>

  <a id="android-btn"  class="btn android platform-hidden" href="https://games.livo.ink/game.apk">Download Android App</a>
  <a id="ios-btn"      class="btn ios     platform-hidden" href="install.mobileconfig">Download iOS App</a>
  <a id="web-btn"      class="btn web     platform-hidden" href="https://games.livo.ink/">Play in Browser</a>

  <p class="note">After installing on iOS, open the Livo icon from your home screen to play. On Android, allow installs from unknown sources if prompted.</p>

  <script>
    var ua = navigator.userAgent || "";
    var isAndroid = /Android/i.test(ua);
    var isiOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;
    document.getElementById("android-btn").classList.toggle("platform-hidden", !isAndroid);
    document.getElementById("ios-btn").classList.toggle("platform-hidden", !isiOS);
    document.getElementById("web-btn").classList.toggle("platform-hidden", isAndroid || isiOS);
  </script>
</body>
</html>
